name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install ast-grep
        run: cargo install ast-grep --locked

      - name: Install dependencies
        run: deno install --frozen

      - name: Format
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno task check

      - name: Drizzle migration graph
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/eclipse
        run: deno task db:check

      - name: Boundary tests
        run: deno task boundary:test

      - name: Boundary lint
        run: deno task boundary:lint

      - name: Tests
        run: deno task test
